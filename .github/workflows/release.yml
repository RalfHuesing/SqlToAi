name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 1. JOB: Baue das Windows-Binary und erstelle das Release-Archiv
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish src/SqlToAi/SqlToAi.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o ./publish

      - name: Prepare Release Archive
        shell: pwsh
        run: |
          # appsettings.json ins Publish-Verzeichnis kopieren falls nicht bereits vorhanden
          if (-not (Test-Path "./publish/appsettings.json") -and (Test-Path "src/SqlToAi/appsettings.json")) {
            Copy-Item "src/SqlToAi/appsettings.json" "./publish/appsettings.json"
          }

          # README.md ins Publish-Verzeichnis kopieren
          if (Test-Path "README.md") {
            Copy-Item "README.md" "./publish/README.md"
          }

          # LICENSE ins Publish-Verzeichnis kopieren
          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "./publish/LICENSE"
          }

          # Archiv aus dem Publish-Verzeichnis erstellen (kein "publish/"-Prefix im Archiv)
          Push-Location "./publish"
          7z a "../SqlToAi-win-x64.zip" . -r | Out-Null
          Pop-Location

      - name: Upload Archive as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-win-x64
          path: ./SqlToAi-win-x64.zip
          if-no-files-found: error
          retention-days: 1

  # 2. JOB: Erstelle das GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Archive
        uses: actions/download-artifact@v4
        with:
          name: archive-win-x64
          path: ./release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
